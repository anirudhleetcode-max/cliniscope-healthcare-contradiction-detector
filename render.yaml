# Render Blueprint for the MEDGUARD shared-workspace API (optional).
# The static frontend stays on GitHub Pages; point it at this service's URL in About & settings.
services:
  - type: web
    name: medguard-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: medguard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MEDGUARD_ALLOWED_ORIGINS
        value: https://anirudhleetcode-max.github.io
      - key: MEDGUARD_ALLOW_REGISTRATION
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false

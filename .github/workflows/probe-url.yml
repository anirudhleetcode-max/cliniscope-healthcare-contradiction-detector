name: Probe public URLs
on:
  push:
    branches: ['chore/medguard-public-url']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate frontend hosts and the API
        run: |
          API=https://medguard-api-duti.onrender.com
          for i in $(seq 1 12); do curl -sf --max-time 30 "$API/api/health" >/dev/null && break; sleep 10; done
          for u in https://medguard.vercel.app/ https://medguard-anirudh-ed2c.vercel.app/ https://medguard-git-claude-fervent-euler-bsgy2t-anirudh-ed2c.vercel.app/; do
            echo "=== $u"
            curl -s -o page.html -w 'status=%{http_code} final=%{url_effective}\n' -L --max-time 30 "$u" || true
            grep -o '<title>[^<]*</title>' page.html || echo "(no title)"
            grep -o 'assets/index-[A-Za-z0-9_-]*\.js' page.html | head -1 || true
            origin="${u%/}"
            echo "--- CORS preflight from $origin"
            curl -s -o /dev/null -D - -X OPTIONS "$API/api/auth/login" -H "Origin: $origin" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | grep -i -E '^HTTP|access-control-allow-origin' || true
          done
          echo "=== ready"; curl -s --max-time 30 "$API/api/ready"; echo

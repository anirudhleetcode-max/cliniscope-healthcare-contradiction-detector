name: Verify production API root (temporary)
on:
  push:
    branches: ['verify/prod-api-root']
permissions:
  contents: read
jobs:
  profile-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://medguard-sigma.vercel.app/
      API_URL: https://medguard-api-duti.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live bundle contains the fix
        run: |
          js=$(curl -s "$BASE_URL" | grep -o 'assets/index-[^"]*\.js' | head -1); echo "bundle: $js"
          curl -s "$BASE_URL$js" | grep -c 'menu-register'
      - run: npx playwright install --with-deps chromium
      - name: Real browser against production - profile menu Sign in / Create account
        run: npx playwright test tests/e2e/shared.spec.ts -g "profile menu" --project=desktop --reporter=line

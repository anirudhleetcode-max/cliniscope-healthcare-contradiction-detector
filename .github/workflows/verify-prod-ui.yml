name: Verify production UI (temporary)
on:
  push:
    branches: ['verify/prod-member-removal']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Google sign-in status on the live API (no secrets involved)
        run: |
          API=https://medguard-api-duti.onrender.com
          for i in $(seq 1 18); do curl -sf --max-time 30 "$API/api/health" >/dev/null && break; sleep 10; done
          echo "health: $(curl -s $API/api/health | python3 -c 'import json,sys;h=json.load(sys.stdin);print({k:h.get(k) for k in ("version","googleSignIn","registration")})')"
          echo "start: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: https://medguard-sigma.vercel.app' -d '{"returnTo":"https://medguard-sigma.vercel.app/"}' $API/api/auth/google/start)"
          echo "ready: $(curl -s $API/api/ready)"

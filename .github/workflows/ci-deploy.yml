name: CI and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Publishes the static build to the gh-pages branch (served by GitHub Pages).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

  # Production verification: runs the end-to-end suite against the live public URL.
  # Primary: GitHub Pages. Fallback (if Pages is not enabled in repo settings):
  # raw.githack.com, a public CDN that serves the gh-pages branch with correct content types.
  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      MIRROR_URL: https://raw.githack.com/${{ github.repository }}/gh-pages/index.html
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Report GitHub Pages configuration
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{status: .status, url: .html_url, source: .source}' \
            || gh api -X POST "repos/${{ github.repository }}/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' \
            || echo "::warning::GitHub Pages is not enabled and GITHUB_TOKEN cannot enable it. Enable it in Settings > Pages (Deploy from branch: gh-pages, / root)."
      - name: Resolve live URL
        id: url
        run: |
          for i in $(seq 1 18); do
            if curl -sf "$PAGES_URL" | grep -q 'CLINISCOPE'; then echo "url=$PAGES_URL" >> "$GITHUB_OUTPUT"; echo "Verified GitHub Pages: $PAGES_URL"; exit 0; fi
            echo "Pages attempt $i: not serving yet"; sleep 10
          done
          for i in $(seq 1 18); do
            if curl -sf "$MIRROR_URL" | grep -q 'CLINISCOPE'; then echo "url=$MIRROR_URL" >> "$GITHUB_OUTPUT"; echo "::notice::GitHub Pages unavailable; verified mirror $MIRROR_URL"; exit 0; fi
            echo "Mirror attempt $i: not serving yet"; sleep 10
          done
          exit 1
      - name: Show response headers of the live assets
        run: |
          base="${{ steps.url.outputs.url }}"; base="${base%index.html}"
          curl -sI "${base}pdf.worker.min.js" | grep -iE '^(HTTP|content-type)' || true
          curl -s "${{ steps.url.outputs.url }}" | grep -oE 'assets/[^"]+\.js' | head -1 | xargs -I{} curl -sI "${base}{}" | grep -iE '^(HTTP|content-type)' || true
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Production smoke tests (full e2e suite against the live URL)
        run: BASE_URL="${{ steps.url.outputs.url }}" npx playwright test --project=desktop --project=mobile

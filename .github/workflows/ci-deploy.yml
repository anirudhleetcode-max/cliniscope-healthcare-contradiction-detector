name: CI and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL server, so the API and database tests also run through the production driver.
    # Official images are pulled from AWS's public mirror of Docker Hub's library images, which is
    # not subject to Docker Hub's unauthenticated pull rate limit on shared runners.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: API and database tests against a real PostgreSQL server
        run: TEST_DATABASE_URL=postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres npx vitest run tests/unit/backend.test.ts tests/unit/server.test.ts tests/unit/sync.test.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Builds the API server image and checks it in both supported database modes.
  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:22-slim -t medguard-api .
      - name: "Free-hosting mode: external PostgreSQL, no volume; data survives replacing the container"
        run: |
          docker network create mg
          docker run -d --name db --network mg -e POSTGRES_PASSWORD=ci-only-not-a-secret -e POSTGRES_DB=medguard public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 2; done
          run_api() {
            docker run -d --name api --network mg -p 8787:8787 \
              -e DATABASE_URL=postgresql://postgres:ci-only-not-a-secret@db:5432/medguard -e MEDGUARD_REQUIRE_DATABASE_URL=true \
              -e MEDGUARD_ALLOW_REGISTRATION=true -e MEDGUARD_ALLOWED_ORIGINS=http://localhost:4173 medguard-api
            for i in $(seq 1 30); do curl -sf http://localhost:8787/api/ready >/dev/null && return 0; sleep 2; done
            docker logs api; return 1
          }
          run_api
          curl -sf http://localhost:8787/api/ready | tee /dev/stderr | grep -q '"storage":"external"'
          TOKEN=$(curl -sf -H 'Content-Type: application/json' -d '{"email":"ci@example.test","password":"synthetic-pass-123","displayName":"CI"}' http://localhost:8787/api/auth/register | jq -r .token)
          curl -sf -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"label":"SYNTHETIC CI case"}' http://localhost:8787/api/cases >/dev/null
          # Replace the container, as a free host does on restart or redeploy: its local disk is gone.
          docker rm -f api
          run_api
          TOKEN=$(curl -sf -H 'Content-Type: application/json' -d '{"email":"ci@example.test","password":"synthetic-pass-123"}' http://localhost:8787/api/auth/login | jq -r .token)
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8787/api/cases | tee /dev/stderr | grep -q 'SYNTHETIC CI case'
          docker rm -f api
      - name: "Guard: refuses to start without DATABASE_URL when one is required"
        run: |
          if docker run --name guard -e MEDGUARD_REQUIRE_DATABASE_URL=true medguard-api; then echo "started without a database"; exit 1; fi
          docker logs guard 2>&1 | grep -q 'Refusing to keep data on an ephemeral disk'
      - name: "Self-hosted mode: embedded database on a volume survives a restart"
        run: |
          docker run -d --name api -p 8787:8787 -v medguard-data:/data -e MEDGUARD_ALLOWED_ORIGINS=http://localhost:4173 medguard-api
          for i in $(seq 1 30); do curl -sf http://localhost:8787/api/ready >/dev/null && break; if [ "$i" = 30 ]; then docker logs api; exit 1; fi; sleep 2; done
          curl -sf http://localhost:8787/api/ready | tee /dev/stderr | grep -q '"storage":"embedded"'
          docker restart api
          for i in $(seq 1 30); do curl -sf http://localhost:8787/api/ready >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8787/api/ready
          docker logs api | tail -5

  # Publishes the static build to the gh-pages branch (served by GitHub Pages).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

  # Production verification: runs the end-to-end suite against the live GitHub Pages URL.
  # GitHub Pages must be enabled once in Settings > Pages (Deploy from branch: gh-pages, / root);
  # the workflow token is not permitted to change that setting.
  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional repository variable (Settings > Secrets and variables > Actions > Variables): the public URL of the
      # deployed API. When set, the shared-workspace e2e tests also run against it with synthetic accounts; when empty they skip.
      API_URL: ${{ vars.MEDGUARD_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check that the live site is serving this build
        id: live
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{status: .status, url: .html_url, source: .source}' \
            || gh api -X POST "repos/${{ github.repository }}/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' \
            || true
          for i in $(seq 1 30); do
            if curl -sf "$SITE_URL" | grep -qi 'medguard'; then echo "available=true" >> "$GITHUB_OUTPUT"; echo "Live: $SITE_URL"; exit 0; fi
            echo "attempt $i: $SITE_URL not serving yet"; sleep 10
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=GitHub Pages not enabled::$SITE_URL is not serving. Enable Settings > Pages > Deploy from a branch > gh-pages / (root), then re-run this workflow."
      - if: steps.live.outputs.available == 'true'
        run: npm ci
      - if: steps.live.outputs.available == 'true'
        run: npx playwright install --with-deps chromium
      - name: Wake the deployed API (free hosting stops it when idle)
        if: steps.live.outputs.available == 'true' && env.API_URL != ''
        run: |
          for i in $(seq 1 18); do curl -sf --max-time 30 "$API_URL/api/ready" && echo && exit 0; echo "attempt $i: API not ready yet"; sleep 10; done
          echo "::error title=API not ready::$API_URL/api/ready did not answer"; exit 1
      - name: Production smoke tests (full e2e suite against the live URL)
        if: steps.live.outputs.available == 'true'
        run: BASE_URL="$SITE_URL" npx playwright test --project=desktop --project=mobile

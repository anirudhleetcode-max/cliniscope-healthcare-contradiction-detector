name: CI and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Builds the API server image and checks that the container serves /api/health.
  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medguard-api .
      - name: Run container and check health
        run: |
          docker run -d --name api -p 8787:8787 -e MEDGUARD_ALLOWED_ORIGINS=http://localhost:4173 medguard-api
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health; then echo; docker logs api | tail -5; exit 0; fi
            sleep 2
          done
          docker logs api; exit 1

  # Publishes the static build to the gh-pages branch (served by GitHub Pages).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

  # Production verification: runs the end-to-end suite against the live GitHub Pages URL.
  # GitHub Pages must be enabled once in Settings > Pages (Deploy from branch: gh-pages, / root);
  # the workflow token is not permitted to change that setting.
  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check that the live site is serving this build
        id: live
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{status: .status, url: .html_url, source: .source}' \
            || gh api -X POST "repos/${{ github.repository }}/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' \
            || true
          for i in $(seq 1 30); do
            if curl -sf "$SITE_URL" | grep -q 'MEDGUARD'; then echo "available=true" >> "$GITHUB_OUTPUT"; echo "Live: $SITE_URL"; exit 0; fi
            echo "attempt $i: $SITE_URL not serving yet"; sleep 10
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=GitHub Pages not enabled::$SITE_URL is not serving. Enable Settings > Pages > Deploy from a branch > gh-pages / (root), then re-run this workflow."
      - if: steps.live.outputs.available == 'true'
        run: npm ci
      - if: steps.live.outputs.available == 'true'
        run: npx playwright install --with-deps chromium
      - name: Production smoke tests (full e2e suite against the live URL)
        if: steps.live.outputs.available == 'true'
        run: BASE_URL="$SITE_URL" npx playwright test --project=desktop --project=mobile

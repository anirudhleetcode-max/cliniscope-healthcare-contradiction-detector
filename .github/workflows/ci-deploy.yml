name: CI and deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Publishes the static build to the gh-pages branch (served by GitHub Pages).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

  # Production verification: runs the end-to-end suite against the live GitHub Pages URL.
  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ensure GitHub Pages serves the gh-pages branch
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq '{status: .status, url: .html_url, source: .source}' \
            || gh api -X POST "repos/${{ github.repository }}/pages" -f 'source[branch]=gh-pages' -f 'source[path]=/' \
            || echo "::warning::Could not enable Pages with GITHUB_TOKEN; enable it in Settings > Pages (branch gh-pages, / root)."
      - name: Wait for the deployed site
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ] && curl -s "${SITE_URL}?v=$GITHUB_SHA" | grep -q 'CLINISCOPE'; then exit 0; fi
            sleep 10
          done
          exit 1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Production smoke tests (full e2e suite against the live URL)
        run: BASE_URL="$SITE_URL" npx playwright test --project=desktop --project=mobile
